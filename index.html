<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CHEAL Market | Student Marketplace</title>
  <link rel="stylesheet" href="styles.css">
  <!-- Supabase JS Client library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <!-- Top Navigation Bar -->
  <header class="navbar">
    <div class="logo">CHEAL Market</div>
    <div class="nav-actions">
      <button id="auth-btn" class="btn-secondary">Sign In</button>
      <button id="post-btn" class="btn-primary">+ Sell Item</button>
    </div>
  </header>

  <!-- User Status Banner -->
  <section class="status-banner">
    <p id="user-status">Browsing as Guest</p>
  </section>

  <!-- Navigation Tabs -->
  <nav class="nav-tabs">
    <button class="tab-btn active" data-tab="feed">Feed</button>
    <button class="tab-btn" data-tab="saved">Saved Items</button>
    <button class="tab-btn" data-tab="chat">Messages</button>
    <button class="tab-btn" data-tab="profile">Profile</button>
  </nav>

  <!-- Main Content Feed -->
  <main class="container">
    <section id="feed-section" class="tab-content active">
      <h2>Recent Listings</h2>
      <div id="products-grid" class="grid">
        <p>Loading items...</p>
      </div>
    </section>

    <section id="saved-section" class="tab-content" style="display: none;">
      <h2>Your Saved Items</h2>
      <div id="saved-grid" class="grid">
        <p>No saved items yet.</p>
      </div>
    </section>

    <section id="chat-section" class="tab-content" style="display: none;">
      <h2>Messages & Real-time Chat</h2>
      <p>Select a seller or listing to start chatting.</p>
    </section>

    <section id="profile-section" class="tab-content" style="display: none;">
      <h2>User Profile</h2>
      <div id="profile-details">
        <p>Please sign in to view and update your profile details.</p>
      </div>
    </section>
  </main>

  <!-- Auth Modal -->
  <div id="auth-modal" class="modal" style="display: none;">
    <div class="modal-content">
      <span class="close-btn" id="close-auth">&times;</span>
      <h3>Sign In / Sign Up</h3>
      <form id="auth-form">
        <input type="email" id="auth-email" placeholder="Your Email" required />
        <input type="password" id="auth-password" placeholder="Your Password" required />
        <div class="auth-actions">
          <button type="submit" id="login-submit-btn" class="btn-primary">Sign In</button>
          <button type="button" id="signup-submit-btn" class="btn-secondary">Create Account</button>
        </div>
      </form>
      <p id="auth-error" class="error-msg"></p>
    </div>
  </div>

  <!-- Post Item Modal -->
  <div id="post-modal" class="modal" style="display: none;">
    <div class="modal-content">
      <span class="close-btn" id="close-post">&times;</span>
      <h3>Post an Item for Sale</h3>
      <form id="post-product-form">
        <input type="text" id="product-title" placeholder="Item Title" required />
        <input type="number" id="product-price" placeholder="Price (UGX)" required />
        <input type="text" id="product-location" placeholder="Location (e.g. Kampala / Campus)" required />
        <button type="submit" class="btn-primary">Post Item</button>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
