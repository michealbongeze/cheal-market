<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Cheal Market</title>
  
  <!-- Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --primary: #1e564d;
      --primary-light: #e8f3f1;
      --accent: #2a7a6d;
      --bg: #ffffff;
      --card-bg: #ffffff;
      --text: #1a1a1a;
      --text-muted: #666666;
      --border: #e2e8f0;
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding-bottom: 70px;
    }

    /* TOP HEADER */
    .top-bar {
      position: sticky;
      top: 0;
      background: var(--card-bg);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      z-index: 100;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-logo {
      width: 36px;
      height: 36px;
      background: var(--primary);
      color: white;
      font-weight: bold;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    .brand-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
    }

    .brand-sub {
      font-size: 11px;
      color: var(--text-muted);
    }

    .icon-btn {
      background: none;
      border: none;
      font-size: 20px;
      cursor: pointer;
      padding: 4px;
    }

    /* SEARCH & LOCATION */
    .search-container {
      padding: 4px 16px;
    }

    .search-box {
      display: flex;
      align-items: center;
      background: white;
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 10px 16px;
    }

    .search-box input {
      border: none;
      outline: none;
      width: 100%;
      margin-left: 8px;
      font-size: 14px;
    }

    .location-tag {
      padding: 8px 16px;
      font-size: 12px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* HERO BANNER */
    .hero-banner {
      margin: 4px 16px 16px 16px;
      background: #2a5b52;
      color: white;
      padding: 20px;
      border-radius: 16px;
    }

    .hero-banner .tagline {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
      opacity: 0.9;
    }

    .hero-banner h2 {
      font-size: 22px;
      font-weight: 800;
      line-height: 1.2;
      margin-bottom: 8px;
    }

    .hero-banner p {
      font-size: 13px;
      opacity: 0.9;
      margin-bottom: 16px;
      line-height: 1.4;
    }

    .hero-btns {
      display: flex;
      gap: 10px;
    }

    .btn-white {
      background: white;
      color: var(--text);
      border: none;
      padding: 10px 18px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
    }

    .btn-outline-light {
      background: rgba(255, 255, 255, 0.2);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.4);
      padding: 10px 18px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
    }

    /* CATEGORIES SECTION */
    .section-subtitle {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--text-muted);
      letter-spacing: 0.5px;
      padding: 0 16px;
      margin-top: 8px;
    }

    .section-title {
      font-size: 18px;
      font-weight: 800;
      padding: 0 16px;
      margin-bottom: 12px;
    }

    .category-grid {
      display: flex;
      gap: 12px;
      padding: 0 16px 16px 16px;
      overflow-x: auto;
    }

    .category-card {
      flex: 1;
      background: white;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 12px;
      text-align: center;
      cursor: pointer;
      min-width: 90px;
    }

    .category-card.active {
      border-color: var(--primary);
      background: var(--primary-light);
    }

    .category-icon {
      font-size: 24px;
      margin-bottom: 6px;
    }

    .category-name {
      font-size: 12px;
      font-weight: 700;
    }

    /* PRODUCT LISTINGS */
    .product-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      padding: 0 16px 16px 16px;
    }

    .product-card-item {
      background: white;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .product-image-wrap {
      width: 100%;
      height: 120px;
      background: #f0f0f0;
      position: relative;
    }

    .product-image-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .save-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(255, 255, 255, 0.9);
      border: none;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      cursor: pointer;
    }

    .save-btn.saved {
      color: #e63946;
    }

    .product-details {
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .product-title {
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .product-price {
      font-size: 14px;
      font-weight: 700;
      color: var(--primary);
    }

    .product-campus {
      font-size: 11px;
      color: var(--text-muted);
    }

    /* BOTTOM NAVIGATION */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 60px;
      background: white;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-around;
      z-index: 1000;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 10px;
      cursor: pointer;
      width: 20%;
    }

    .nav-item .icon {
      font-size: 18px;
    }

    .nav-item.active {
      color: var(--primary);
      font-weight: 600;
    }

    .nav-sell-btn {
      position: relative;
      top: -10px;
      background: #2a5b52;
      color: white;
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
    }

    .hidden {
      display: none !important;
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .form-group input, .form-group select, .form-group textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
    }

    .btn-block {
      width: 100%;
      background: var(--primary);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }

    .empty-state {
      text-align: center;
      padding: 20px 16px;
      grid-column: span 2;
      color: var(--text-muted);
      font-size: 13px;
    }
  </style>
</head>
<body>

  <!-- TOP HEADER -->
  <header class="top-bar">
    <button class="icon-btn" onclick="navigateTo('home')">☰</button>
    <div class="brand" onclick="navigateTo('home')">
      <div class="brand-logo">C</div>
      <div>
        <div class="brand-title">Cheal</div>
        <div class="brand-sub">Market</div>
      </div>
    </div>
    <button class="icon-btn" onclick="navigateTo('account')">👤</button>
  </header>

  <!-- HOME SCREEN -->
  <main id="screen-home" class="screen">
    <div class="search-container">
      <div class="search-box">
        🔍 <input type="text" id="searchInput" placeholder="Search phones, clothes, books..." oninput="handleSearch(this.value)" />
      </div>
    </div>
    <div class="location-tag">📍 Kampala</div>

    <div class="hero-banner">
      <div class="tagline">BUILT FOR CAMPUS LIFE</div>
      <h2>Buy. Sell. Connect.</h2>
      <p>Find affordable products from students around your campus.</p>
      <div class="hero-btns">
        <button class="btn-white" onclick="navigateTo('home')">Start Shopping</button>
        <button class="btn-outline-light" onclick="navigateTo('sell')">Sell an Item</button>
      </div>
    </div>

    <div class="section-subtitle">EXPLORE</div>
    <div class="section-title">Categories</div>
    <div class="category-grid">
      <div class="category-card" onclick="selectCategory('Phones', this)">
        <div class="category-icon">📱</div>
        <div class="category-name">Phones</div>
      </div>
      <div class="category-card" onclick="selectCategory('Computers', this)">
        <div class="category-icon">💻</div>
        <div class="category-name">Computers</div>
      </div>
      <div class="category-card" onclick="selectCategory('Fashion', this)">
        <div class="category-icon">👕</div>
        <div class="category-name">Fashion</div>
      </div>
    </div>

    <div class="section-title">Latest Listings</div>
    <div class="product-grid" id="productGrid"></div>
  </main>

  <!-- SAVED SCREEN -->
  <main id="screen-saved" class="screen hidden" style="padding-top: 16px;">
    <div class="section-title">Saved Items</div>
    <div class="product-grid" id="savedGrid"></div>
  </main>

  <!-- SELL SCREEN -->
  <main id="screen-sell" class="screen hidden" style="padding: 16px;">
    <div class="section-title" style="padding:0; margin-bottom: 16px;">Post an Item</div>
    <form id="sellForm">
      <div class="form-group">
        <label>Item Name</label>
        <input type="text" id="productName" required placeholder="e.g. iPhone 11 64GB" />
      </div>
      <div class="form-group">
        <label>Price (UGX)</label>
        <input type="number" id="productPrice" required placeholder="e.g. 650000" />
      </div>
      <div class="form-group">
        <label>Category</label>
        <select id="productCategory" required>
          <option value="Phones">Phones</option>
          <option value="Computers">Computers</option>
          <option value="Fashion">Fashion</option>
        </select>
      </div>
      <div class="form-group">
        <label>Campus / Location</label>
        <input type="text" id="productCampus" required placeholder="e.g. KIU Main Campus" />
      </div>
      <div class="form-group">
        <label>Description</label>
        <textarea id="productDescription" rows="3" placeholder="Condition, specs, contact details..."></textarea>
      </div>
      <button type="submit" class="btn-block">Publish Listing</button>
      <div id="sellMessage" style="margin-top:10px; font-size:12px; text-align:center;"></div>
    </form>
  </main>

  <!-- ACCOUNT SCREEN -->
  <main id="screen-account" class="screen hidden" style="padding: 16px;">
    <div class="section-title" style="padding:0; margin-bottom: 16px;">Account Settings</div>
    <div style="display:flex; align-items:center; gap:12px; margin-bottom:20px;">
      <div style="width:50px; height:50px; background:var(--primary); color:white; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:20px; font-weight:bold;">👤</div>
      <div>
        <div style="font-size:14px; font-weight:bold;">Student User</div>
        <div style="font-size:12px; color:var(--text-muted);">cheal@market.app</div>
      </div>
    </div>
  </main>

  <!-- BOTTOM NAVIGATION -->
  <nav class="bottom-nav">
    <button class="nav-item active" onclick="navigateTo('home', this)">
      <span class="icon">🏠</span>
      <span>Home</span>
    </button>
    <button class="nav-item" onclick="navigateTo('saved', this)">
      <span class="icon">♡</span>
      <span>Saved</span>
    </button>
    <button class="nav-item" onclick="navigateTo('sell', this)">
      <div class="nav-sell-btn">+</div>
      <span style="margin-top:2px;">Sell</span>
    </button>
    <button class="nav-item" onclick="navigateTo('account', this)">
      <span class="icon">👤</span>
      <span>Account</span>
    </button>
  </nav>

  <script>
    const SUPABASE_URL = 'https://qwklkqjfbrhythpynghr.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF3bGtscWpmYnJoeXRocHluZ2hyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEwMjg3MzEsImV4cCI6MjEwNjYwNDczMX0.BUscEhVhQd0bNS8VHHHlJUxudmsF0tXpx5PC9_oQ2-I';

    const supabase = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

    let savedIds = new Set(JSON.parse(localStorage.getItem('cheal_saved_ids') || '[]'));
    let activeCategory = null;
    let searchQuery = '';

    function navigateTo(screenName, btnEl = null) {
      document.querySelectorAll('.screen').forEach(s => {
        s.id === `screen-${screenName}` ? s.classList.remove('hidden') : s.classList.add('hidden');
      });

      if (btnEl) {
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        btnEl.classList.add('active');
      }

      if (screenName === 'home') fetchProducts();
      if (screenName === 'saved') fetchSavedProducts();

      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function selectCategory(cat, cardEl) {
      if (activeCategory === cat) {
        activeCategory = null;
        cardEl.classList.remove('active');
      } else {
        activeCategory = cat;
        document.querySelectorAll('.category-card').forEach(c => c.classList.remove('active'));
        cardEl.classList.add('active');
      }
      fetchProducts();
    }

    function handleSearch(val) {
      searchQuery = val.trim().toLowerCase();
      fetchProducts();
    }

    async function fetchProducts() {
      const grid = document.getElementById('productGrid');
      if (!grid) return;

      if (!supabase) {
        grid.innerHTML = '<div class="empty-state">Database connection unavailable.</div>';
        return;
      }

      grid.innerHTML = '<div class="empty-state">Loading listings...</div>';

      let query = supabase.from('products').select('*').order('created_at', { ascending: false });

      if (activeCategory) {
        query = query.eq('category', activeCategory);
      }

      const { data: products, error } = await query;

      if (error) {
        grid.innerHTML = `<div class="empty-state" style="color:red;">Error loading items: ${error.message}</div>`;
        return;
      }

      let filtered = products || [];
      if (searchQuery) {
        filtered = filtered.filter(p => (p.name || p.title || '').toLowerCase().includes(searchQuery));
      }

      if (filtered.length === 0) {
        grid.innerHTML = '<div class="empty-state">No listings found. Add one using the + Sell tab!</div>';
        return;
      }

      renderGrid(filtered, grid);
    }

    async function fetchSavedProducts() {
      const grid = document.getElementById('savedGrid');
      if (savedIds.size === 0 || !supabase) {
        grid.innerHTML = '<div class="empty-state">No saved items yet.</div>';
        return;
      }

      const { data: products } = await supabase.from('products').select('*').in('id', Array.from(savedIds));
      renderGrid(products || [], grid);
    }

    function renderGrid(items, targetGrid) {
      targetGrid.innerHTML = '';
      items.forEach(item => {
        const isSaved = savedIds.has(String(item.id));
        const title = item.name || item.title || 'Untitled Item';
        const price = item.price ? `UGX ${Number(item.price).toLocaleString()}` : 'Contact';
        const image = item.image_url || 'https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=400';

        const card = document.createElement('div');
        card.className = 'product-card-item';
        card.innerHTML = `
          <div class="product-image-wrap">
            <img src="${image}" alt="${title}" />
            <button type="button" class="save-btn ${isSaved ? 'saved' : ''}" onclick="toggleSave('${item.id}', this)">
              ${isSaved ? '♥' : '♡'}
            </button>
          </div>
          <div class="product-details">
            <strong class="product-title">${title}</strong>
            <p class="product-price">${price}</p>
            <small class="product-campus">📍 ${item.campus || 'Kampala'}</small>
          </div>
        `;
        targetGrid.appendChild(card);
      });
    }

    function toggleSave(id, btn) {
      const strId = String(id);
      if (savedIds.has(strId)) {
        savedIds.delete(strId);
        btn.classList.remove('saved');
        btn.textContent = '♡';
      } else {
        savedIds.add(strId);
        btn.classList.add('saved');
        btn.textContent = '♥';
      }
      localStorage.setItem('cheal_saved_ids', JSON.stringify(Array.from(savedIds)));
    }

    document.getElementById('sellForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!supabase) return;

      const name = document.getElementById('productName').value;
      const price = parseFloat(document.getElementById('productPrice').value);
      const category = document.getElementById('productCategory').value;
      const campus = document.getElementById('productCampus').value;
      const description = document.getElementById('productDescription').value;

      const { error } = await supabase.from('products').insert([
        { name, price, category, campus, description }
      ]);

      const msg = document.getElementById('sellMessage');
      if (error) {
        msg.style.color = 'red';
        msg.textContent = error.message;
      } else {
        msg.style.color = 'green';
        msg.textContent = 'Item posted successfully!';
        document.getElementById('sellForm').reset();
        setTimeout(() => {
          msg.textContent = '';
          navigateTo('home');
        }, 1200);
      }
    });

    document.addEventListener('DOMContentLoaded', fetchProducts);
  </script>
</body>
</html>
